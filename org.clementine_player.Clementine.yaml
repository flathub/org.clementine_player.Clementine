app-id: org.clementine_player.Clementine
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: clementine
finish-args:
  - --device=dri
  - --filesystem=/media
  - --filesystem=/mnt
  - --filesystem=/run/media
  - --filesystem=xdg-music
  - --own-name=org.kde.StatusNotifierItem-2-2
  - --own-name=org.mpris.MediaPlayer2.clementine
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=fallback-x11
  - --socket=wayland
  - --system-talk-name=org.freedesktop.Avahi
  - --system-talk-name=org.freedesktop.UDisks2
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.mpris.MediaPlayer2.Player
  - --talk-name=org.wiimotedev.deviceEvents
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/gtk-doc
  - /share/info
  - /share/man
  - /lib/*.a
  - /lib/*.la
modules:
  - shared-modules/glew/glew.json
  - shared-modules/glu/glu-9.json
  - shared-modules/linux-audio/fftw3f.json
  - name: libmtp
    config-opts:
      - --disable-static
      - --with-udev=/app/lib/udev
    sources:
      - type: archive
        url: https://github.com/libmtp/libmtp/releases/download/v1.1.23/libmtp-1.1.23.tar.gz
        sha256: 74a2b6e8cb4a0304e95b995496ea3ac644c29371649b892b856e22f12a0bdeed
        x-checker-data:
          type: anitya
          project-id: 10017
          url-template: 
            https://github.com/libmtp/libmtp/releases/download/v$version/libmtp-$version.tar.gz
  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix="${FLATPAK_DEST}"
      - ./b2 -j ${FLATPAK_BUILDER_N_JOBS} headers
      - cp -r boost "${FLATPAK_DEST}/include/boost"
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.bz2
        sha256: 5c1d40cb8e19adbf740a4ec2da35b3e58f3f5804b1dce44deb53df72193cbc6c
        x-checker-data:
          type: anitya
          project-id: 6845
          stable-only: true
          url-template: 
            https://archives.boost.io/release/$version/source/boost_${major}_${minor}_$patch.tar.bz2

  - name: protobuf
    buildsystem: cmake-ninja
    config-opts:
      - -Dprotobuf_BUILD_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/protocolbuffers/protobuf/archive/v36.2.tar.gz
        sha256: 7e7eaf580ec77f1a392ff1ab1013c13d3b04a6716f002f697f67f3c1113f0530
        x-checker-data:
          type: anitya
          project-id: 3715
          stable-only: true
          url-template: https://github.com/protocolbuffers/protobuf/archive/v$version.tar.gz
    cleanup:
      - /bin

  - name: chromaprint
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_SHARED_LIBS=ON
    sources:
      - type: archive
        url: 
          https://github.com/acoustid/chromaprint/releases/download/v1.6.2/chromaprint-1.6.2.tar.gz
        sha256: d54ada62c16b2db396d3251ec54fc7a58909c163131a1cfcf7fa6407dbc14360
        x-checker-data:
          type: anitya
          project-id: 286
          stable-only: true
          url-template: 
            https://github.com/acoustid/chromaprint/releases/download/v$version/chromaprint-$version.tar.gz

  - name: libcdio
    config-opts:
      - --without-cd-drive
      - --without-cd-info
      - --without-cdda-player
      - --without-cd-read
      - --without-iso-info
      - --without-iso-read
      - --with-pic
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libcdio/libcdio/releases/download/2.4.0/libcdio-2.4.0.tar.bz2
        sha256: 8e6a305f81e45a78b41ce696d34497cc208d97075469d7304c11a6d44bf006ac
        x-checker-data:
          type: anitya
          project-id: 1573
          stable-only: true
          url-template: 
            https://github.com/libcdio/libcdio/releases/download/$version/libcdio-$version.tar.bz2
    cleanup:
      - /bin



  - name: sparsehash
    sources:
      - type: archive
        url: https://github.com/sparsehash/sparsehash/archive/sparsehash-2.0.4.tar.gz
        sha256: 8cd1a95827dfd8270927894eb77f62b4087735cbede953884647f16c521c7e58
        x-checker-data:
          type: anitya
          project-id: 4863
          stable-only: true
          url-template: https://github.com/sparsehash/sparsehash/archive/sparsehash-$version.tar.gz


  - name: clementine
    builddir: true
    buildsystem: cmake-ninja
    post-install:
      - install -Dm644 -t "${FLATPAK_DEST}/share/metainfo" ../org.clementine_player.Clementine.appdata.xml
    sources:
      - type: archive
        url: 
          https://github.com/clementine-player/Clementine/releases/download/1.4.5/clementine-1.4.5.tar.xz
        sha256: a9287fa259aba1ff818aa33f7bc64f6e18ad1d585726116f04ef8d00673e795f
        x-checker-data:
          type: json
          url: https://api.github.com/repos/clementine-player/Clementine/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name == "clementine-" + $version + ".tar.xz")
            | .browser_download_url
          timestamp-query: .published_at
          is-main-source: true
      - type: file
        path: org.clementine_player.Clementine.appdata.xml
